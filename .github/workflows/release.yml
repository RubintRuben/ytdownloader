name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "from version import APP_VERSION; print(APP_VERSION)"
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag must match APP_VERSION (v$version)"
          }
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test "tests/*.cjs"
      - name: Build and verify Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm downloader.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smoke = Start-Process -FilePath (Resolve-Path dist/Downloader.exe) -ArgumentList '--verify-package' -PassThru -WindowStyle Hidden
          if (-not $smoke.WaitForExit(60000)) { throw 'Package verification timed out.' }
          if ($smoke.ExitCode -ne 0) { throw "Package verification failed ($($smoke.ExitCode))." }
      - uses: actions/upload-artifact@v4
        with:
          name: Downloader-Windows
          path: dist/Downloader.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Downloader-Windows
      - name: Publish release and Windows asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Downloader.exe --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
